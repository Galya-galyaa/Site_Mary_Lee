<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="icon" href="img/Logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <header class="head-with-logo">
        <div class="headerTop">
            <a href="index.html" class="header__logo">
                <img src="img/for_logo_header/logo.svg" alt="Логотип">
            </a>
            <a href="index.html" class="header_Icon_right">
                <img src="img/for_logo_header/special_line.svg" alt="Спец.линия">
            </a>
        </div>
        <div class="headerMiddle">
            <nav class="headerNav">
                <a href="index.html">ГЛАВНАЯ</a>
                <a href="catalog.html">КАТАЛОГ</a>
                <a href="about.html">О НАС</a>
            </nav>
        
            <div class="headerIcons">
                <a href="profile.html" class="icon-link"><img src="img/for_logo_header/profile.svg" alt="Профиль"></a>
                <a href="favorites.html" class="icon-link"><img src="img/for_logo_header/favorites.svg" alt="Избранное"></a>
                <a href="cart.html" class="icon-link"><img src="img/for_logo_header/bag.svg" alt="Корзина"></a>
            </div>
        </div>
        <div class="headerBottom">
            <div class="headerSearchRow">
                <button class="headerSearchBtn" aria-label="Найти">
                    <img src="img/for_logo_header/search.svg" alt="Поиск">
                </button>
                <div class="headerSearchBox">Найдите что-нибудь красивое</div>
            </div>
        </div>
    </header>

    <main class="profile-container">
        <section class="profile-left">
            <div class="profile-header-wrapper">
                <h1 class="profile-title">ЛИЧНЫЙ КАБИНЕТ</h1>
                <button type="button" class="edit-btn" id="editProfileBtn" aria-label="Редактировать профиль">
                    <img src="img/edit-dark.svg" alt="Редактировать">
                </button>
            </div>
            
            <div class="profile-avatar">
                <span id="avatarLetter">Г</span>
            </div>

            <form class="profile-form">
                <div class="form-group">
                    <label class="form-label required">Ф.И.О.</label>
                    <input type="text" class="form-input profile-input" id="fioInput" placeholder="Иванова" value="Иванова Марина" disabled>
                    <div class="error-message" id="fioError"></div>
                </div>

                <div class="form-group">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" class="profile-input" value="female" checked disabled>
                            <span class="radio-custom"></span>
                            Женский
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" class="profile-input" value="male" disabled>
                            <span class="radio-custom"></span>
                            Мужской
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label required">Дата рождения</label>
                    <input type="date" class="form-input profile-input" id="dateInput" value="2002-06-12" disabled>
                    <div class="error-message" id="dateError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label required">Электронная почта</label>
                    <input type="text" class="form-input profile-input" id="emailInput" placeholder="ivanovna@mail.ru" value="ivanovna@mail.ru" disabled>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label required">Контактный телефон</label>
                    <input type="tel" class="form-input profile-input" id="phoneInput" placeholder="+7 (922) 612-76-78" value="+" disabled>
                    <div class="error-message" id="phoneError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label required">Город</label>
                    <div class="city-wrapper">
                        <input type="text" class="form-input profile-input" id="cityInput" placeholder="Нижний Тагил" value="Нижний Тагил" disabled autocomplete="off">
                        <div class="city-suggestions" id="citySuggestions"></div>
                    </div>
                    <div class="error-message" id="cityError"></div>
                </div>

                <button type="submit" class="profile-submit" id="saveProfileBtn">СОХРАНИТЬ</button>
                <button type="button" class="profile-cancel hidden" id="cancelProfileBtn">Отменить изменения</button>
                <button type="button" class="profile-delete">Удалить личные данные и кабинет</button>
            </form>
        </section>

        <aside class="profile-right">
            <a href="favorites.html" class="profile-menu-btn">
                <span class="profile-menu-text">Избранное</span>
                <img src="img/for_catalog/arrow_right_for_all.svg" alt=">" class="profile-menu-arrow">
            </a>
            
            <a href="cart.html" class="profile-menu-btn">
                <span class="profile-menu-text">Корзина</span>
                <img src="img/for_catalog/arrow_right_for_all.svg" alt=">" class="profile-menu-arrow">
            </a>
            
            <a href="#" class="profile-menu-btn">
                <span class="profile-menu-text exit">Выйти</span>
                <img src="img/for_catalog/arrow_right_for_all.svg" alt=">" class="profile-menu-arrow">
            </a>
        </aside>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__col footer__col_left">
                <div class="footer__logo">Mary Lee</div>
                <p class="footer__desc">Интернет-магазин для красивого настроения</p>
            </div>
            <div class="footer__col footer__col_center">
                <h4 class="footer__title">ИНФОРМАЦИЯ</h4>
                <ul class="footer__nav-list">
                    <li><a href="about.html" class="footer__link">О нас</a></li>
                    <li><a href="catalog.html" class="footer__link">Каталог</a></li>
                    <li><a href="#" class="footer__link">Как сделать заказ</a></li>
                    <li><a href="#" class="footer__link">Доставка</a></li>
                </ul>
            </div>
            <div class="footer__col footer__col_right">
                <h4 class="footer__title">КОНТАКТЫ</h4>
                <ul class="footer__nav-list">
                    <li><a href="#" class="footer__link">+ 7 (3435) 452 28</a></li>
                    <li><a href="#" class="footer__link">marrylee@mail.ru</a></li>
                </ul>
            </div>
        </div>
        <img src="img/for_footer/line-left.svg" alt="" class="footer__line">
    </footer>
    <script src="profile.js"></script>
</body>
</html>
